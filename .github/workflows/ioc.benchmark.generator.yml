name: SourceGen.Ioc Generator Benchmark

on:
  push:
    branches: [main]
    # Markdown never affects the benchmarks; the exclusion is last so no later pattern re-includes it.
    paths:
      - 'src/Ioc/src/SourceGen.Ioc/**'
      - 'src/Ioc/src/SourceGen.Ioc.SourceGenerator/**'
      - 'src/Ioc/test/SourceGen.Ioc.GeneratorBenchmark/**'
      - 'src/Ioc/test/Directory.Build.props'
      - 'src/Directory.Build.props'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ioc.benchmark.generator.yml'
      - '.github/workflows/ioc.benchmark.generator.comment.yml'
      - '.github/scripts/**'
      - '!**/*.md'
  pull_request:
    branches: [main]
    # labeled/unlabeled re-run the comparison when the accept label changes; other labels skip the run.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/Ioc/src/SourceGen.Ioc/**'
      - 'src/Ioc/src/SourceGen.Ioc.SourceGenerator/**'
      - 'src/Ioc/test/SourceGen.Ioc.GeneratorBenchmark/**'
      - 'src/Ioc/test/Directory.Build.props'
      - 'src/Directory.Build.props'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ioc.benchmark.generator.yml'
      - '.github/workflows/ioc.benchmark.generator.comment.yml'
      - '.github/scripts/**'
      - '!**/*.md'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BENCHMARK_PROJECT: src/Ioc/test/SourceGen.Ioc.GeneratorBenchmark/SourceGen.Ioc.GeneratorBenchmark.csproj
  REGRESSION_THRESHOLD_PERCENT: '5'
  # Roslyn's analysis driver varies allocations by up to about 4% between identical runs.
  ANALYZER_ALLOCATION_THRESHOLD_PERCENT: '10'
  ACCEPT_LABEL: benchmark-accept-allocation

jobs:
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'benchmark-accept-allocation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      base-label: ${{ steps.plan.outputs.base-label }}
      head-label: ${{ steps.plan.outputs.head-label }}
      accepted: ${{ steps.plan.outputs.accepted }}

    steps:
      # The measured commit and its parents are enough to label the run and diff it against the base.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          ACCEPTED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark-accept-allocation') }}
        run: |
          set -euo pipefail

          short() { git rev-parse --short "$1"; }

          if [[ "$EVENT_NAME" == pull_request ]]; then
            # The merge commit's first parent is the target branch.
            head_label="$(short HEAD^2) merged into $BASE_REF"
            base_label="$BASE_REF@$(short HEAD^1)"
          else
            head_label="$REF_NAME@$(short HEAD)"
            base_label="$REF_NAME@$(short HEAD^1)"
          fi

          # Updates of packages that neither the harness, the generator nor its runtime library use, such as test
          # and CLI packages, cannot change the results. A manual run always measures.
          irrelevant='TUnit|Verify\.TUnit|System\.IO\.Abstractions|System\.IO\.Abstractions\.TestingHelpers|ConsoleAppFramework|ConsoleAppFramework\.CliSchema|ZLogger|Microsoft\.AspNetCore\.Components\.Web|StyleCop\.Analyzers'
          run=true
          changed="$(git diff --name-only HEAD^1 HEAD -- ':(exclude)*.md')"
          if [[ "$EVENT_NAME" != workflow_dispatch && "$changed" == Directory.Packages.props ]]; then
            # Every added or removed line must be the version of an irrelevant package; anything else measures.
            relevant="$(git diff --unified=0 HEAD^1 HEAD -- Directory.Packages.props \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
              | grep -vE "^[+-][[:space:]]*<PackageVersion Include=\"($irrelevant)\" Version=\"[^\"]*\"[[:space:]]*/>[[:space:]]*$" || true)"
            if [[ -z "$relevant" ]]; then
              run=false
              echo "Only packages that the benchmarks do not use changed, so the benchmark is skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo "run=$run"
            echo "base-label=$base_label"
            echo "head-label=$head_label"
            echo "accepted=$ACCEPTED"
          } >> "$GITHUB_OUTPUT"

  # Each class runs on its own runner in parallel. Its base and head run on that runner, so time comparisons
  # are not affected by runner hardware, and its *Overhead benchmarks estimate the drift between them.
  measure:
    name: measure (${{ matrix.class }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        class: [GeneratorBenchmarks, ColdGeneratorBenchmarks, AnalyzerBenchmarks]
    # Job-level so that a skipped run for an unrelated label never cancels a running benchmark.
    # Newer commits replace older runs of the same pull request; every other run is kept.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.class }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare base
        id: base
        shell: bash
        run: |
          set -euo pipefail

          base_dir=""
          if git cat-file -e "HEAD^1:$BENCHMARK_PROJECT" 2>/dev/null; then
            base_dir="$RUNNER_TEMP/base"
            git worktree add --detach "$base_dir" HEAD^1
          else
            echo "The base has no $BENCHMARK_PROJECT, so the head is measured without a baseline."
          fi
          echo "dir=$base_dir" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      # The base may pin a different SDK; the base worktree's global.json selects it.
      - name: Setup .NET for base
        id: setup-base
        if: steps.base.outputs.dir != ''
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.base.outputs.dir }}/global.json

      - name: Build head
        run: dotnet build "$BENCHMARK_PROJECT" -c Release

      # A base that cannot build, for example when this change fixes its build, leaves the head without a baseline.
      - name: Build base
        id: build-base
        if: steps.base.outputs.dir != '' && steps.setup-base.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ steps.base.outputs.dir }}
        run: dotnet build "$BENCHMARK_PROJECT" -c Release

      - name: Run benchmarks
        shell: bash
        env:
          BASE_DIR: ${{ steps.build-base.outcome == 'success' && steps.base.outputs.dir || '' }}
          CLASS: ${{ matrix.class }}
          # Scenarios per BenchmarkDotNet run. Smaller groups shorten the time between a benchmark's base and head runs,
          # but every run builds its own benchmark executable first.
          GROUP_SIZE: '2'
        run: |
          set -euo pipefail

          results="$RUNNER_TEMP/generator-benchmark"
          harness() {
            (cd "$1" && shift && dotnet run --project "$BENCHMARK_PROJECT" -c Release --no-build -- "$@" </dev/null)
          }
          # Compiling the output in every benchmark process is skipped; GeneratorPerformanceTests compiles it.
          run() {
            local dir="$1" out="$2"
            shift 2
            harness "$dir" --filter "$@" \
              --job short --warmupCount 3 --iterationCount 8 --iterationTime 300 \
              --envVars DOTNET_TieredCompilation:0 SOURCEGEN_BENCHMARK_SKIP_COMPILE_VALIDATION:true \
              --exporters json \
              --artifacts "$out"
          }
          scenarios() {
            harness "$1" --scenarios "$CLASS" | tr -d '\r' | grep -E '^[A-Za-z0-9_]+$' || true
          }

          # Scenarios that only the base has are measured too, so removed benchmarks are reported. A base harness
          # without --scenarios contributes none.
          mapfile -t all < <({
            scenarios "$GITHUB_WORKSPACE"
            if [[ -n "$BASE_DIR" ]] && grep -q -- '"--scenarios"' "$BASE_DIR/src/Ioc/test/SourceGen.Ioc.GeneratorBenchmark/Program.cs"; then
              scenarios "$BASE_DIR"
            fi
          } | sort -u)
          if (( ${#all[@]} == 0 )); then
            echo "::error title=No scenarios::The head harness listed no scenarios for $CLASS."
            exit 1
          fi

          # Groups alternate base-head and head-base, so a steady drift during the job affects both sides equally.
          head_status=0
          for ((group = 0; group * GROUP_SIZE < ${#all[@]}; group++)); do
            filters=()
            for scenario in "${all[@]:group * GROUP_SIZE:GROUP_SIZE}"; do
              filters+=("*.$CLASS.*(Count: 500, Scenario: $scenario)")
            done
            if (( group % 2 == 0 )); then order=(base head); else order=(head base); fi

            for side in "${order[@]}"; do
              out="$results/$side/$CLASS/group-$group"
              if [[ "$side" == head ]]; then
                run "$GITHUB_WORKSPACE" "$out" "${filters[@]}" || head_status=$?
              elif [[ -n "$BASE_DIR" ]] && ! run "$BASE_DIR" "$out" "${filters[@]}"; then
                # A failed base run leaves these head results without a baseline instead of failing the job.
                # Its partial reports move out of the compared directory but stay in the uploaded artifact.
                echo "::warning title=Base benchmark failed::The base run of $CLASS group $group failed, so its head results are reported without a baseline."
                if [[ -d "$out" ]]; then
                  mkdir -p "$results/failed-base/$CLASS"
                  mv "$out" "$results/failed-base/$CLASS/group-$group"
                fi
              fi
            done
          done
          exit "$head_status"

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ioc-generator-benchmark-${{ matrix.class }}
          path: ${{ runner.temp }}/generator-benchmark
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  generator-benchmark:
    needs: [plan, measure]
    # A measure job cancelled by a newer commit makes this run's comparison incomplete, so it is not reported.
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Build head
        run: dotnet build "$BENCHMARK_PROJECT" -c Release

      # A measure job that failed before uploading leaves its benchmarks missing, which the comparison reports.
      - name: Download benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: ioc-generator-benchmark-*Benchmarks
          path: ${{ runner.temp }}/generator-benchmark
          merge-multiple: true

      - name: Compare with base
        shell: bash
        env:
          ACCEPTED: ${{ needs.plan.outputs.accepted }}
          BASE_LABEL: ${{ needs.plan.outputs.base-label }}
          HEAD_LABEL: ${{ needs.plan.outputs.head-label }}
        run: |
          set -euo pipefail

          results="$RUNNER_TEMP/generator-benchmark"
          mkdir -p "$results"
          # A path that does not exist compares the head without a baseline.
          args=(--compare "$results/base" "$results/head" "$results/table.md" "$REGRESSION_THRESHOLD_PERCENT"
            --allocation-threshold "AnalyzerBenchmarks=$ANALYZER_ALLOCATION_THRESHOLD_PERCENT")
          if [[ "$ACCEPTED" == true ]]; then
            args+=(--accept-regressions)
          fi

          status=0
          dotnet run --project "$BENCHMARK_PROJECT" -c Release --no-build -- "${args[@]}" || status=$?

          {
            echo "## SourceGen.Ioc generator benchmark"
            echo
            if [[ -n "$(find "$results/base" -name '*-report*.json' -print -quit 2>/dev/null)" ]]; then
              echo "Head \`$HEAD_LABEL\` is compared with base \`$BASE_LABEL\`. Each benchmark class ran on its own runner, alternating between base and head runs of its scenarios."
            else
              echo "Head \`$HEAD_LABEL\` is reported without a baseline because base \`$BASE_LABEL\` produced no results."
            fi
            if [[ -d "$results/failed-base" ]]; then
              echo
              echo "Some base runs failed, so their head results have no baseline."
            fi
            if [[ "$ACCEPTED" == true ]]; then
              echo
              echo "The \`$ACCEPT_LABEL\` label accepts allocation regressions and removed benchmarks in this pull request."
            fi
            echo
            if [[ -f "$results/table.md" ]]; then
              cat "$results/table.md"
            else
              echo "The comparison failed. See the workflow log for details."
            fi
            if [[ "$status" -ne 0 ]]; then
              echo
              echo "If the change is intentional, add the \`$ACCEPT_LABEL\` label to the pull request to accept it."
            fi
          } > "$results/comparison.md"

          cat "$results/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publish BenchmarkDotNet report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          results="$RUNNER_TEMP/generator-benchmark"
          for side in head base; do
            for report in "$results/$side"/**/*-report-github.md; do
              {
                echo
                echo "<details><summary>BenchmarkDotNet report (${report#"$results/"})</summary>"
                echo
                cat "$report"
                echo
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Upload comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ioc-generator-benchmark-comparison
          path: |
            ${{ runner.temp }}/generator-benchmark/comparison.md
            ${{ runner.temp }}/generator-benchmark/table.md
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      # Pull request runs only have a read-only token; ioc.benchmark.generator.comment.yml posts this report.
      - name: Prepare pull request comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          comment="$RUNNER_TEMP/pr-comment"
          mkdir -p "$comment"
          echo "$PR_NUMBER" > "$comment/pr-number.txt"
          if [[ -f "$RUNNER_TEMP/generator-benchmark/comparison.md" ]]; then
            cp "$RUNNER_TEMP/generator-benchmark/comparison.md" "$comment/comparison.md"
          else
            printf '## SourceGen.Ioc generator benchmark\n\nThe benchmark did not produce a comparison. See the workflow run for details.\n' > "$comment/comparison.md"
          fi

      - name: Upload pull request comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: ioc-generator-benchmark-comment
          path: ${{ runner.temp }}/pr-comment
          retention-days: 7
          overwrite: true
