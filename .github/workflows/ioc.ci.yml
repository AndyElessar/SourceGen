name: SourceGen.Ioc CI

on:
  workflow_dispatch:

  push:
    branches: [main]
    # Markdown never changes build or test results (AnalyzerReleases.*.md only affects warnings, PACKAGE.md is pack-only);
    # the exclusion is last so no later pattern re-includes it.
    paths:
      - 'src/Ioc/src/SourceGen.Ioc/**'
      - 'src/Ioc/src/SourceGen.Ioc.SourceGenerator/**'
      - 'src/Ioc/test/SourceGen.Ioc.Test/**'
      - 'src/Ioc/test/SourceGen.Ioc.TestAot/**'
      - 'src/Ioc/test/SourceGen.Ioc.TestCase/**'
      - 'src/Ioc/test/SourceGen.Ioc.GeneratorBenchmark/GeneratorBenchmarkInput.cs'
      - 'src/Ioc/test/Directory.Build.props'
      - 'src/Directory.Build.props'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ioc.ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/Ioc/src/SourceGen.Ioc/**'
      - 'src/Ioc/src/SourceGen.Ioc.SourceGenerator/**'
      - 'src/Ioc/test/SourceGen.Ioc.Test/**'
      - 'src/Ioc/test/SourceGen.Ioc.TestAot/**'
      - 'src/Ioc/test/SourceGen.Ioc.TestCase/**'
      - 'src/Ioc/test/SourceGen.Ioc.GeneratorBenchmark/GeneratorBenchmarkInput.cs'
      - 'src/Ioc/test/Directory.Build.props'
      - 'src/Directory.Build.props'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/ioc.ci.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet run --project src/Ioc/test/SourceGen.Ioc.Test/SourceGen.Ioc.Test.csproj -c Release --no-build

  aot-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Publish AOT
        run: dotnet publish src/Ioc/test/SourceGen.Ioc.TestAot/SourceGen.Ioc.TestAot.csproj -c Release -o ./publish-aot

      - name: Run AOT tests
        run: ./publish-aot/SourceGen.Ioc.TestAot
